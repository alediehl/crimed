<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Urquiza: Cronología de una muerte evitable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1a3a52;
            --secondary-color: #d32f2f;
            --text-dark: #333;
            --text-light: #666;
            --border-color: #e0e0e0;
            --bg-light: #f9f9f9;
            --accent-blue: #0066cc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: #fff;
        }

        /* Header Navigation */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 0;
            border-bottom: 4px solid var(--secondary-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
        }

        .language-selector {
            display: flex;
            gap: 0.5rem;
        }

        .lang-btn {
            background: transparent;
            border: 2px solid white;
            color: white;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            border-radius: 4px;
        }

        .lang-btn.active {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }

        .lang-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Main Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--primary-color) 0%, #0d1e2d 100%);
            color: white;
            padding: 4rem 2rem;
            text-align: center;
            margin-bottom: 3rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero .subtitle {
            font-size: 1.2rem;
            opacity: 0.95;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Content Sections */
        .content {
            margin: 3rem 0;
        }

        .section-title {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid var(--secondary-color);
        }

        .timeline {
            position: relative;
            padding: 2rem 0;
        }

        .timeline-item {
            margin-bottom: 2.5rem;
            padding-left: 2rem;
            border-left: 3px solid var(--secondary-color);
            position: relative;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -9px;
            top: 0;
            width: 15px;
            height: 15px;
            background-color: var(--secondary-color);
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 0 2px var(--secondary-color);
        }

        .timeline-date {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin-bottom: 0.5rem;
        }

        .timeline-content {
            color: var(--text-light);
            line-height: 1.8;
        }

        .timeline-content p {
            margin-bottom: 1rem;
        }

        /* Highlighted sections */
        .highlight-box {
            background-color: #fff3cd;
            border-left: 4px solid #ff9800;
            padding: 1.5rem;
            margin: 2rem 0;
            border-radius: 4px;
        }

        .highlight-box p {
            margin-bottom: 0.5rem;
        }

        .warning-box {
            background-color: #ffebee;
            border-left: 4px solid var(--secondary-color);
            padding: 1.5rem;
            margin: 2rem 0;
            border-radius: 4px;
        }

        /* Text blocks */
        .narrative-section {
            margin: 2rem 0;
            padding: 1.5rem;
            background-color: var(--bg-light);
            border-radius: 4px;
            line-height: 1.9;
        }

        .narrative-section p {
            margin-bottom: 1rem;
            text-align: justify;
        }

        /* Language content */
        .content-block {
            display: none;
        }

        .content-block.active {
            display: block;
        }

        /* Footer */
        footer {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem;
            margin-top: 4rem;
            text-align: center;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                gap: 1rem;
            }

            .hero h1 {
                font-size: 1.8rem;
            }

            .section-title {
                font-size: 1.5rem;
            }

            .timeline-item {
                padding-left: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">Clínica Urquiza - Testimonio</div>
            <div class="language-selector">
                <button class="lang-btn active" onclick="changeLanguage('es')">Español</button>
                <button class="lang-btn" onclick="changeLanguage('en')">English</button>
                <button class="lang-btn" onclick="changeLanguage('de')">Deutsch</button>
            </div>
        </div>
    </header>

    <!-- SPANISH VERSION -->
    <div id="spanish" class="content-block active">
        <div class="hero">
            <h1 id="hero-title-es"></h1>
            <p class="subtitle" id="hero-desc-es"></p>
        </div>

        <div class="container">
            <div class="content" id="content-es"></div>
        </div>
    </div>

    <!-- ENGLISH VERSION -->
    <div id="english" class="content-block">
        <div class="hero">
            <h1 id="hero-title-en"></h1>
            <p class="subtitle" id="hero-desc-en"></p>
        </div>

        <div class="container">
            <div class="content" id="content-en"></div>
        </div>
    </div>

    <!-- GERMAN VERSION -->
    <div id="german" class="content-block">
        <div class="hero">
            <h1 id="hero-title-de"></h1>
            <p class="subtitle" id="hero-desc-de"></p>
        </div>

        <div class="container">
            <div class="content" id="content-de"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Testimonio de Aristovol Gomez | Clínica Urquiza - Medical Malpractice Documentation</p>
        <p>Este sitio documenta un caso de negligencia médica grave con fines educativos y de justicia.</p>
    </footer>

    <script>
        // Content data embedded directly
        const loadedContent = {
            es: null,
            en: null,
            de: null
        };

        // Load all content on page load
        async function initializeContent() {
            try {
                // Try to load from JSON files first
                for (const lang of ['es', 'en', 'de']) {
                    try {
                        const response = await fetch(`content-${lang}.json`);
                        if (response.ok) {
                            loadedContent[lang] = await response.json();
                        }
                    } catch (e) {
                        console.warn(`Could not load content-${lang}.json from file`);
                    }
                }
                
                // If files didn't load, we'll show an error message
                if (!loadedContent.es && !loadedContent.en && !loadedContent.de) {
                    document.body.innerHTML = '<div style="padding: 2rem; text-align: center;"><h1>Content Loading Error</h1><p>The content files could not be loaded. Please ensure content-es.json, content-en.json, and content-de.json are in the same directory as index.html.</p></div>';
                    return;
                }
                
                changeLanguage('es'); // Load Spanish by default
            } catch (error) {
                console.error('Error loading content:', error);
            }
        }

        function renderTimeline(timelineData) {
            return timelineData.map(item => `
                <div class="timeline-item">
                    <div class="timeline-date">${item.date}</div>
                    <div class="timeline-content">
                        ${item.content.split('\n\n').map(p => {
                            // Handle bold text
                            p = p.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                            return `<p>${p}</p>`;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderContent(lang) {
            const content = loadedContent[lang];
            if (!content) return '';

            const warningTitle = lang === 'es' ? 'La realidad: ' : lang === 'en' ? 'The reality: ' : 'Die Realität: ';

            return `
                <section class="narrative-section">
                    ${content.introduction.text.map(p => `<p>${p}</p>`).join('')}
                </section>

                <h2 class="section-title">${content.secondMalpractice.title}</h2>

                <div class="timeline">
                    ${renderTimeline(content.secondMalpractice.timeline)}
                </div>

                <div class="warning-box">
                    <p><strong>${warningTitle}</strong>${content.secondMalpractice.warning}</p>
                </div>

                <h2 class="section-title">${content.firstMalpractice.title}</h2>
                
                <div class="narrative-section">
                    ${content.firstMalpractice.introduction.map(p => `<p>${p}</p>`).join('')}
                </div>

                <div class="warning-box">
                    ${content.firstMalpractice.warning.split('\n\n').map(p => `<p>${p}</p>`).join('')}
                </div>

                <div class="narrative-section">
                    ${content.firstMalpractice.narrative.map(p => `<p>${p}</p>`).join('')}
                </div>

                <section class="narrative-section">
                    ${content.conclusion.text.map(p => `<p>${p}</p>`).join('')}
                </section>
            `;
        }

        function changeLanguage(lang) {
            // Hide all content blocks
            document.getElementById('spanish').classList.remove('active');
            document.getElementById('english').classList.remove('active');
            document.getElementById('german').classList.remove('active');

            // Remove active class from all buttons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Set active based on language
            const langIndex = lang === 'es' ? 0 : lang === 'en' ? 1 : 2;
            document.querySelectorAll('.lang-btn')[langIndex].classList.add('active');

            // Update HTML lang attribute
            document.documentElement.lang = lang;

            // Load content from JSON
            const content = loadedContent[lang];
            if (!content) return;

            // Update hero
            document.getElementById(`hero-title-${lang}`).innerHTML = 
                `${content.hero.title}<br>${content.hero.subtitle}`;
            document.getElementById(`hero-desc-${lang}`).textContent = content.hero.description;

            // Update main content
            document.getElementById(`content-${lang}`).innerHTML = renderContent(lang);

            // Update footer
            document.querySelector('footer').innerHTML = `
                <p>${content.footer.copyright}</p>
                <p>${content.footer.note}</p>
            `;

            // Show the active language block
            document.getElementById(lang === 'es' ? 'spanish' : lang === 'en' ? 'english' : 'german').classList.add('active');
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initializeContent);
    </script>
</body>
</html>
